name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches Makefile version
        run: |
          version="$(sed -n 's/^VERSION[:=]*[[:space:]]*//p' Makefile)"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag"

      - name: Build PROS template artifacts
        run: python3 scripts/build_release.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^VERSION[:=]*[[:space:]]*//p' Makefile)"
          gh release create "v${version}" "dist/WallSnap@${version}.zip" \
            --title "WallSnap ${version}" \
            --notes "WallSnap ${version} PROS template release."

      - name: Publish depot branch
        run: |
          version="$(sed -n 's/^VERSION[:=]*[[:space:]]*//p' Makefile)"
          cp depot/stable.json /tmp/stable.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan depot
          git rm -rf .
          cp /tmp/stable.json stable.json
          git add stable.json
          git commit -m "Update depot for WallSnap ${version}"
          git push --force origin depot

